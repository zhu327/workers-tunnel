name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        name: Check
        steps:
            - uses: actions/checkout@v4
            # No toolchain input: rust-toolchain.toml governs, so a new lint
            # landing in stable cannot break the build on its own.
            - uses: actions-rust-lang/setup-rust-toolchain@v1
            - name: Format
              run: cargo fmt --check
            # The worker only ever runs as wasm.
            - name: Lint
              run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
            - name: Test
              run: cargo test
