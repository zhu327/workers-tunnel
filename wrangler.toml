name = "workers-tunnel"
main = "build/worker/shim.mjs"
compatibility_date = "2024-09-02"

[build]
command = "cargo install -q worker-build && worker-build --release"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Set with `wrangler secret put USER_ID`, not here. Anything under [vars] is
# committed to the repository and is readable from the dashboard, and a
# credential published next to the code makes the worker an open proxy for
# anyone who reads it. Tunnel traffic is refused while this is unset.
USER_ID = ""

# Fallback relays, whitespace separated, tried in order when the destination
# refuses the connection. An entry may pin its own port ("proxy.example:8443");
# one without a port uses the port the client asked for.
PROXY_IP = ""

# A site to mirror for everything that is not a tunnel upgrade. Recommended:
# without it those requests answer 404, which is a thin cover story.
FALLBACK_SITE = ""

# Serve the vless:// URI at /<USER_ID>. Off by default: it hands the full
# credential to anyone who can reach that path.
SHOW_URI = "false"
